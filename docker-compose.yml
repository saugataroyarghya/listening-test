services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-listening-demo-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TRANSCRIPTION_CONCURRENCY_LIMIT: "1"
      WHISPER_DEVICE: "cpu"
      WHISPER_CPU_THREADS: "1"
      WHISPER_NUM_WORKERS: "1"
      MAX_AUDIO_SIZE_MB: "20"
    volumes:
      - model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  model-cache:
